name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Pas de Gradle wrapper (fichier binaire) : version de Gradle fixée ici.
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Tests unitaires
        run: gradle --no-daemon testDebugUnitTest

      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Compiler l'APK debug
        run: gradle --no-daemon assembleDebug

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hublot.apk

      - name: Artefact APK
        uses: actions/upload-artifact@v7
        with:
          name: hublot-${{ github.run_number }}
          path: hublot.apk

      # Une release par build sur main : le lien « latest » pointe toujours
      # vers le dernier APK.
      - name: Publier la release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" hublot.apk \
            --title "Hublot · build ${{ github.run_number }}" \
            --notes "APK debug compilé depuis ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --latest
